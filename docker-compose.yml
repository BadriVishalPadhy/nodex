services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: sh -c "cd packages/db && pnpm exec prisma db push --skip-generate"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-seed:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: >
      node -e "
        const { PrismaClient } = require('./packages/db/generated/prisma');
        const p = new PrismaClient();
        (async () => {
          await p.availableTriggerNodes.upsert({where:{id:'webhook'},create:{id:'webhook',name:'Webhook'},update:{}});
          await p.availableTriggerNodes.upsert({where:{id:'manual'},create:{id:'manual',name:'Manual Trigger'},update:{}});
          await p.availableActionNodes.upsert({where:{id:'email'},create:{id:'email',name:'Email'},update:{}});
          await p.availableActionNodes.upsert({where:{id:'telegram'},create:{id:'telegram',name:'Telegram'},update:{}});
          await p.availableActionNodes.upsert({where:{id:'discord'},create:{id:'discord',name:'Discord'},update:{}});
          console.log('Seeded');
          process.exit(0);
        })().catch(e => { console.error(e); process.exit(1); });
      "
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      HOOKS_BASE_URL: ${HOOKS_BASE_URL:-}
    depends_on:
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://server:8000
    depends_on:
      - server

  webhooks:
    build:
      context: .
      dockerfile: apps/webhooks/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db-seed:
        condition: service_completed_successfully

  processor:
    build:
      context: .
      dockerfile: apps/processor/Dockerfile
    restart: always
    volumes:
      - ./certs:/app/certs:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKER: ${KAFKA_BROKER:-localhost:9092}
      KAFKA_CERTS_PATH: /app/certs
    depends_on:
      db-seed:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    restart: always
    volumes:
      - ./certs:/app/certs:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKER: ${KAFKA_BROKER:-localhost:9092}
      KAFKA_CERTS_PATH: /app/certs
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      db-seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
